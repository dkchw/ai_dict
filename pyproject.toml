[project]
name = "ai-dict"
version = "11.1.0"
description = "AI Dictionary Web App"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlmodel>=0.0.16",
    "openai>=1.14.0",
    "pydantic-settings>=2.2.1",
    "typer>=0.12.0",
    "platformdirs>=4.0.0",
    "python-multipart",
    "ctranslate2>=4.8.2",
    "sentencepiece>=0.2.2",
    "huggingface-hub>=1.32.0",
    "langdetect>=1.0.9",
    "tokenizers>=0.23.2",
]

[project.scripts]
ai_dict = "ai_dict.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_dict"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ai_dict",
]
