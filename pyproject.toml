[project]
name = "ai-dict"
version = "1.6.0"
description = "AI Dictionary Web App"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlmodel>=0.0.16",
    "openai>=1.14.0",
    "pydantic-settings>=2.2.1",
    "typer>=0.12.0",
    "platformdirs>=4.0.0",
]

[project.scripts]
ai_dict = "ai_dict.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_dict"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ai_dict",
]
